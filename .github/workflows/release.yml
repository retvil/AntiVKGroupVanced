name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install psutil ttkbootstrap pyinstaller
      - name: Run tests
        run: python -m pytest tests/ -q -p no:cacheprovider
      - name: Build all .spec (Vanced + Extended)
        run: |
          Get-ChildItem *.spec | ForEach-Object {
            python -m PyInstaller --noconfirm $_.Name
          }
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.exe
  publish:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = ${{ github.ref_name }}
          $body = Get-Content CHANGELOG.md -Raw | Select-String -Pattern "(?s)^## \[$tag\].*?(?=^## |\Z)" | ForEach-Object { $_.Matches[0].Value }
          if (-not $body) { $body = "Release $tag" }
          gh release create "$tag" --title $tag --notes $body --target main dist/*.exe
